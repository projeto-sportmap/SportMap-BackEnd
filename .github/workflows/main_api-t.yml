# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - api-t

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A1B0CC2F1FB49EE9AAA0E06025C5497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB7B38705FB24AE9B73C787946C834EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A12B8278B3C240F38CCFC4A195C09449 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-t'
          slot-name: 'Production'
          package: .

      - name: Verify production health and login database query
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          base = 'https://api-t-hbe3era3emfxengh.brazilsouth-01.azurewebsites.net'
          for attempt in range(12):
              results = []
              for path, payload, expected in [('/health', None, 200), ('/login', {'email': 'deploy-smoke@example.invalid', 'senha': 'deploy-smoke-invalid-password'}, 401)]:
                  request = urllib.request.Request(base + path, data=json.dumps(payload).encode() if payload else None, headers={'Content-Type': 'application/json', 'Origin': 'https://front-end.brayanrodrigues713.workers.dev'})
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code
                  except (urllib.error.URLError, TimeoutError):
                      status = None
                  results.append(status == expected)
                  print(json.dumps({'path': path, 'status': status, 'expected': expected}))
              if all(results):
                  break
              if attempt == 11:
                  raise RuntimeError('Production login failed its smoke test; verify database migrations')
              time.sleep(5)
