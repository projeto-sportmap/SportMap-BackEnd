name: Diagnose api-t login (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A1B0CC2F1FB49EE9AAA0E06025C5497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB7B38705FB24AE9B73C787946C834EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A12B8278B3C240F38CCFC4A195C09449 }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install isolated database diagnostic driver
        run: npm install --prefix "$RUNNER_TEMP/sportmap-diag" --ignore-scripts --no-audit --no-fund pg@8.22.0
      - name: Read configuration and errors without exposing secrets
        shell: python
        run: |
          import json, os, re, subprocess, urllib.request, urllib.error, urllib.parse

          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError('Azure read operation failed: ' + args[0] + ' ' + args[1])
              return json.loads(result.stdout)

          apps = az('webapp', 'list', '--query', "[?name=='api-t']")
          if len(apps) != 1:
              raise RuntimeError('Expected exactly one api-t App Service accessible to the deployment identity')
          app = apps[0]
          group = app['resourceGroup']
          values = az('webapp', 'config', 'appsettings', 'list', '-g', group, '-n', 'api-t')
          settings = {item['name']: item['value'] or '' for item in values}
          secrets = []
          for key, value in settings.items():
              if value and re.search(r'SECRET|PASSWORD|TOKEN|KEY|CONNECTION|DATABASE|DIRECT_URL', key, re.I):
                  secrets.append(value)
                  if len(value) > 3:
                      print('::add-mask::' + value.replace('\n', '%0A').replace('\r', '%0D'))
          def redact(text):
              for secret in sorted(secrets, key=len, reverse=True):
                  text = text.replace(secret, '[redacted]')
              return re.sub(r'(postgres(?:ql)?://)[^\s@]+@', r'\1[redacted]@', text)

          database_url = settings.get('DATABASE_URL', '')
          parsed = urllib.parse.urlsplit(database_url)
          if parsed.password:
              secrets.extend([parsed.password, urllib.parse.unquote(parsed.password)])
          config = az('webapp', 'config', 'show', '-g', group, '-n', 'api-t')
          print(json.dumps({'diagnostic': 'configuration', 'app': app['name'], 'state': app['state'], 'runtime': config.get('linuxFxVersion'), 'nodeEnv': settings.get('NODE_ENV'), 'databaseConfigured': bool(database_url), 'databaseHost': parsed.hostname, 'sslmode': urllib.parse.parse_qs(parsed.query).get('sslmode')}))

          origin = 'https://front-end.brayanrodrigues713.workers.dev'
          base = 'https://' + app['defaultHostName']
          for path, body in [('/health', None), ('/login', {'email': 'diagnostico-login@example.invalid', 'senha': 'diagnostico-sem-conta'})]:
              request = urllib.request.Request(base + path, data=json.dumps(body).encode() if body else None, headers={'Content-Type': 'application/json', 'Origin': origin})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(json.dumps({'diagnostic': 'http', 'path': path, 'status': response.status}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'http', 'path': path, 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'http', 'path': path, 'error': str(error)})))

          scm = next((host for host in app['enabledHostNames'] if '.scm.' in host), None)
          if scm:
              token = az('account', 'get-access-token', '--resource', 'https://management.azure.com/')['accessToken']
              request = urllib.request.Request('https://' + scm + '/api/vfs/site/wwwroot/logs/error.log', headers={'Authorization': 'Bearer ' + token, 'Range': 'bytes=-65536'})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      tail = response.read(1024 * 1024).decode('utf-8', errors='replace').splitlines()[-8:]
                  for line in tail:
                      try:
                          record = json.loads(line)
                      except ValueError:
                          continue
                      allowed = {key: record[key] for key in ['timestamp', 'level', 'message', 'errorMessage', 'errorType', 'stack', 'sqlState', 'code', 'causeMessage'] if key in record}
                      print('SERVER_ERROR ' + redact(json.dumps(allowed)))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'serverErrorLog', 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'serverErrorLog', 'error': str(error)})))

          # Probe only the production connection setting, using a read-only transaction
          # and a fictional address. No user row is returned or logged.
          if database_url:
              driver = os.path.join(os.environ['RUNNER_TEMP'], 'sportmap-diag/node_modules/pg/lib/index.js')
              code = """
          import pg from %s;
          const pool = new pg.Pool({connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000, statement_timeout: 10000});
          try {
            const client = await pool.connect();
            try {
              await client.query('BEGIN READ ONLY');
              await client.query('SELECT id,nome,sobrenome,username,email,senha_hash,foto_perfil_url,cidade,latitude,longitude,bio,created_at,updated_at,role,tipo_usuario_id,foto_perfil_data,foto_capa_data FROM public.usuarios WHERE email=$1 LIMIT 1', ['diagnostico-login@example.invalid']);
              console.log(JSON.stringify({diagnostic:'databaseQuery',status:'ok'}));
            } finally { await client.query('ROLLBACK'); client.release(); }
          } catch(e) {
            console.log(JSON.stringify({diagnostic:'databaseQuery',name:e.name,code:e.code,message:e.message}));
          } finally { await pool.end(); }
          """ % json.dumps(driver)
              result = subprocess.run(['node', '--input-type=module', '-e', code], env={**os.environ, 'DATABASE_URL': database_url}, capture_output=True, text=True, timeout=40)
              print(redact(result.stdout))
              if result.returncode:
                  print(json.dumps({'diagnostic': 'databaseProbeProcess', 'exitCode': result.returncode}))
