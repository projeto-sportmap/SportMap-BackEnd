name: Diagnose api-t login (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A1B0CC2F1FB49EE9AAA0E06025C5497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB7B38705FB24AE9B73C787946C834EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A12B8278B3C240F38CCFC4A195C09449 }}
      - name: Read server error codes without reading application secrets
        shell: python
        run: |
          import json, re, subprocess, urllib.request, urllib.error

          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError('Azure read operation failed: ' + args[0] + ' ' + args[1])
              return json.loads(result.stdout)

          apps = az('webapp', 'list', '--query', "[?name=='api-t']")
          if len(apps) != 1:
              raise RuntimeError('Expected exactly one api-t App Service accessible to the deployment identity')
          app = apps[0]
          group = app['resourceGroup']
          def redact(text):
              text = re.sub(r'(postgres(?:ql)?://)[^\s@]+@', r'\1[redacted]@', text)
              text = re.sub(r'(?i)(password|token|secret|api[_-]?key)([\s:=]+)[^\s,;]+', r'\1\2[redacted]', text)
              return re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[redacted-token]', text)

          config = az('webapp', 'config', 'show', '-g', group, '-n', 'api-t')
          print(json.dumps({'diagnostic': 'runtime', 'app': app['name'], 'state': app['state'], 'runtime': config.get('linuxFxVersion')}))

          origin = 'https://front-end.brayanrodrigues713.workers.dev'
          base = 'https://' + app['defaultHostName']
          for path, body in [('/health', None), ('/login', {'email': 'diagnostico-login@example.invalid', 'senha': 'diagnostico-sem-conta'})]:
              request = urllib.request.Request(base + path, data=json.dumps(body).encode() if body else None, headers={'Content-Type': 'application/json', 'Origin': origin})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(json.dumps({'diagnostic': 'http', 'path': path, 'status': response.status}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'http', 'path': path, 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'http', 'path': path, 'error': str(error)})))

          scm = next((host for host in app['enabledHostNames'] if '.scm.' in host), None)
          if scm:
              token = az('account', 'get-access-token', '--resource', 'https://management.azure.com/')['accessToken']
              request = urllib.request.Request('https://' + scm + '/api/vfs/site/wwwroot/logs/error.log', headers={'Authorization': 'Bearer ' + token, 'Range': 'bytes=-65536'})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      tail = response.read(1024 * 1024).decode('utf-8', errors='replace').splitlines()[-8:]
                  for line in tail:
                      try:
                          record = json.loads(line)
                      except ValueError:
                          continue
                      allowed = {key: record[key] for key in ['timestamp', 'level', 'message', 'errorMessage', 'errorType', 'sqlState', 'code', 'causeMessage'] if key in record}
                      print('SERVER_ERROR ' + redact(json.dumps(allowed)))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'serverErrorLog', 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'serverErrorLog', 'error': str(error)})))

