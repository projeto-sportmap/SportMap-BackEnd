name: Diagnose api-t login (read only)

on:
  workflow_dispatch:
    inputs:
      account_email:
        description: Optional account email for read-only existence and password-format checks
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A1B0CC2F1FB49EE9AAA0E06025C5497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB7B38705FB24AE9B73C787946C834EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A12B8278B3C240F38CCFC4A195C09449 }}
      - name: Read server error codes without reading application secrets
        shell: python
        env:
          ACCOUNT_EMAIL: ${{ inputs.account_email }}
        run: |
          import json, os, re, subprocess, time, urllib.request, urllib.error

          def az(*args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError('Azure read operation failed: ' + args[0] + ' ' + args[1])
              return json.loads(result.stdout)

          apps = az('webapp', 'list', '--query', "[?name=='api-t']")
          if len(apps) != 1:
              raise RuntimeError('Expected exactly one api-t App Service accessible to the deployment identity')
          app = apps[0]
          group = app['resourceGroup']
          def redact(text):
              text = re.sub(r'(postgres(?:ql)?://)[^\s@]+@', r'\1[redacted]@', text)
              text = re.sub(r'(?i)(password|token|secret|api[_-]?key)([\s:=]+)[^\s,;]+', r'\1\2[redacted]', text)
              return re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[redacted-token]', text)

          config = az('webapp', 'config', 'show', '-g', group, '-n', 'api-t')
          print(json.dumps({'diagnostic': 'runtime', 'app': app['name'], 'state': app['state'], 'runtime': config.get('linuxFxVersion')}))

          origin = 'https://front-end.brayanrodrigues713.workers.dev'
          base = 'https://' + app['defaultHostName']
          for path, body in [('/health', None), ('/login', {'email': 'diagnostico-login@example.invalid', 'senha': 'diagnostico-sem-conta'})]:
              request = urllib.request.Request(base + path, data=json.dumps(body).encode() if body else None, headers={'Content-Type': 'application/json', 'Origin': origin})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(json.dumps({'diagnostic': 'http', 'path': path, 'status': response.status}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'http', 'path': path, 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'http', 'path': path, 'error': str(error)})))

          scm = next((host for host in app['enabledHostNames'] if '.scm.' in host), None)
          if scm:
              token = az('account', 'get-access-token', '--resource', 'https://management.azure.com/')['accessToken']
              request = urllib.request.Request('https://' + scm + '/api/vfs/site/wwwroot/logs/error.log', headers={'Authorization': 'Bearer ' + token, 'Range': 'bytes=-65536'})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      tail = response.read(1024 * 1024).decode('utf-8', errors='replace').splitlines()[-8:]
                  for line in tail:
                      try:
                          record = json.loads(line)
                      except ValueError:
                          continue
                      allowed = {key: record[key] for key in ['timestamp', 'level', 'message', 'errorMessage', 'errorType', 'sqlState', 'code', 'causeMessage'] if key in record}
                      print('SERVER_ERROR ' + redact(json.dumps(allowed)))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'diagnostic': 'serverErrorLog', 'status': error.code}))
              except Exception as error:
                  print(redact(json.dumps({'diagnostic': 'serverErrorLog', 'error': str(error)})))

          email = os.environ.get('ACCOUNT_EMAIL', '').strip().lower()
          if email:
              if not scm or len(email) > 255 or not re.fullmatch(r'[^\s@]+@[^\s@]+\.[^\s@]+', email):
                  raise RuntimeError('Invalid account diagnostic request')
              run_id = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[0-9]+-[0-9]+', run_id):
                  raise RuntimeError('Invalid run identifier')
              code = r"""
          const fs = require('node:fs');
          const output = '/home/LogFiles/sportmap-account-diagnostic-' + RUN_ID + '.json';
          (async () => {
            let pool, client;
            let transaction = false;
            let result;
            try {
              const {Pool} = require('pg');
              const url = process.env.DATABASE_URL || process.env.APPSETTING_DATABASE_URL;
              if (!url) throw new Error('Database environment unavailable');
              pool = new Pool({connectionString:url,connectionTimeoutMillis:10000,statement_timeout:10000});
              client = await pool.connect();
              await client.query('BEGIN READ ONLY'); transaction = true;
              const {rows} = await client.query('SELECT senha_hash, email=$1 AS exact FROM public.usuarios WHERE lower(btrim(email))=$1 LIMIT 2', [ACCOUNT_EMAIL]);
              const exact = rows.find(row => row.exact);
              result = {
                diagnostic:'account',
                exactAccountFound:!!exact,
                normalizedAccountFound:rows.length > 0,
                normalizedAccountAmbiguous:rows.length > 1,
                bcryptFormatValid:exact ? /^\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}$/.test(exact.senha_hash) : null,
                exitCode:0
              };
            } catch(error) {
              result = {diagnostic:'account',exitCode:1,name:error.name,code:error.code};
            } finally {
              if(client) { if(transaction) await client.query('ROLLBACK'); client.release(); }
              if(pool) await pool.end();
              fs.mkdirSync('/home/LogFiles',{recursive:true});
              fs.writeFileSync(output,JSON.stringify(result));
              fs.unlinkSync(__filename);
            }
          })();
          """
              code = 'const ACCOUNT_EMAIL = ' + json.dumps(email) + '; const RUN_ID = ' + json.dumps(run_id) + ';\n' + code
              script_name = '.sportmap-account-diagnostic-' + run_id + '.cjs'
              upload = urllib.request.Request('https://' + scm + '/api/vfs/site/wwwroot/' + script_name, data=code.encode(), method='PUT', headers={'Authorization':'Bearer ' + token,'If-Match':'*','Content-Type':'application/javascript'})
              with urllib.request.urlopen(upload, timeout=30) as response:
                  if response.status not in [200,201,204]:
                      raise RuntimeError('Unable to prepare account diagnostic')
              instances = az('webapp','list-instances','-g',group,'-n','api-t')
              submission = subprocess.run(['az','webapp','exec','-g',group,'-n','api-t','--mode','execute','--command','node /home/site/wwwroot/' + script_name,'--working-directory','/home/site/wwwroot','--instance',instances[0]['name'],'--only-show-errors'],capture_output=True,text=True,timeout=60)
              if submission.returncode:
                  raise RuntimeError('Account diagnostic submission failed')
              account_result = None
              for attempt in range(45):
                  request = urllib.request.Request('https://' + scm + '/api/vfs/LogFiles/sportmap-account-diagnostic-' + run_id + '.json',headers={'Authorization':'Bearer ' + token})
                  try:
                      with urllib.request.urlopen(request,timeout=15) as response:
                          account_result = json.load(response)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                  time.sleep(2)
              if account_result is None:
                  raise RuntimeError('Account diagnostic did not complete')
              print(json.dumps(account_result))
              if account_result.get('exitCode') != 0:
                  raise RuntimeError('Account diagnostic failed')

